name: Build & Release Noor APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Release APK
        env:
          KEY_PASSWORD: android
          STORE_PASSWORD: android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Locate & Prepare APK
        id: apk_file
        run: |
          mkdir -p release_assets
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/noor-v1.0.0.apk
          elif [ -f "release/noor-v1.0.0.apk" ]; then
            cp release/noor-v1.0.0.apk release_assets/noor-v1.0.0.apk
          fi
          echo "apk_path=release_assets/noor-v1.0.0.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-v1.0.0-apk
          path: release_assets/noor-v1.0.0.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Noor Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_assets/noor-v1.0.0.apk
          body: |
            ## 🌟 Noor – Your Daily Islamic Companion (v1.0.0)

            Download the production-ready signed APK below to install on your Android device:
            - **[Direct APK Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/noor-v1.0.0.apk)**

            ### Features included in this build:
            - 📖 **Al-Quran Recitation** with Arabic, Bengali Meaning, Phonetic Pronunciation (বাংলা উচ্চারণ) & English translation.
            - 💾 **Offline Room Database Caching**: Reads instantly without internet.
            - 🕌 **Accurate Prayer Times & Next Prayer Countdown** with location awareness.
            - 🧭 **Real-time Qibla Compass** with sensor fusion.
            - 📜 **Daily Hadith** with instant refresh & Bengali explanations.
            - 🌙 **Daily Fasting / Ramadan Timetable** (Imsak, Sehri & Iftar).
            - 🔔 **Prayer Reminders & Audio Notifications**.
